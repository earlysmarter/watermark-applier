<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Batch-apply a repeated watermark to local image folders in Chrome or Edge."
    />
    <title>Watermark Applier</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="brand-row">
          <img src="./watermark-logo.svg" alt="Watermark Applier" class="brand-logo" />
          <div>
            <h1 id="app-title">Watermark Applier</h1>
            <p id="support-message" class="support-message"></p>
          </div>
        </div>

        <div class="action-row">
          <button id="select-folder" type="button">Select folder</button>
          <span id="folder-name" class="folder-name">Waiting for a folder</span>
        </div>

        <div class="progress-area" aria-live="polite">
          <div class="progress-label">
            <strong id="progress-title">Choose a folder to start processing images.</strong>
            <span id="progress-percent">0%</span>
          </div>
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>

        <ol id="log-list" class="log-list"></ol>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
